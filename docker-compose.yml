### EXAMPLE DOCKER COMPOSE ###
services:
  audiobookshelf:
    # Builds this fork's server together with this fork's React client, using
    # the React repo's own Dockerfile. The React side is fetched from GitHub at
    # build time, so only this repository needs to be on disk. Each rebuild
    # picks up whatever is on the React fork's master branch.
    #
    #   docker compose up -d --build
    #
    # Needs Docker Compose 2.17+ (for additional_contexts) and network access
    # to GitHub during the build. To run the frozen Vue client instead, use
    # docker-compose.vue.yml.
    build:
      context: https://github.com/rusty324/audiobookshelf-client-react.git#master
      dockerfile: Dockerfile
      additional_contexts:
        # Names the Dockerfile expects: the React client, and this server
        abs-client: https://github.com/rusty324/audiobookshelf-client-react.git#master
        abs-server: .
    image: audiobookshelf-react:local
    # ABS runs on port 13378 by default. If you want to change
    # the port, only change the external port, not the internal port
    ports:
      - 13378:80
    volumes:
      # These volumes are needed to keep your library persistent
      # and allow media to be accessed by the ABS server.
      # The path to the left of the colon is the path on your computer,
      # and the path to the right of the colon is where the data is
      # available to ABS in Docker.
      # You can change these media directories or add as many as you want
      - ./audiobooks:/audiobooks
      - ./podcasts:/podcasts
      # The metadata directory can be stored anywhere on your computer
      - ./metadata:/metadata
      # The config directory needs to be on the same physical machine
      # you are running ABS on
      - ./config:/config
    restart: unless-stopped
    # You can use the following user directive to run the ABS
    # docker container as a specific user. You will need to change
    # the UID and GID to the correct values for your user.
    # user: 1000:1000
